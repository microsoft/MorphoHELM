# Config-driven paper graph regeneration.
#
# Paths are resolved relative to the repository root unless absolute.

paths:
  normalize_config: "data-preprocessing/configs/normalize_splits.yaml"
  normalized_root: "data/main_paper_inputs/normalized"
  aggregated_root: "data/main_paper_inputs/aggregated"
  results_root: "results/main_paper_graphs"
  paper_dir: "paper/Cellprofiling_Benchmark"
  metadata:
    moa_labels: "feature-extraction/configs/labeled_moa_samples.csv"
    cpg_plate_metadata: "feature-extraction/metadata/metadata.parquet"
    bbbc036_metadata: "data/main_paper_inputs/metadata/bbbc036_metadata.parquet"
    stringdb: "data/enrichment/protein_databases/StringDB.parquet"
  qc_cell_counts_dir: "data/qc/cell_counts"
  haldane:
    old_path: "results/moa_enrichment/bbbc036_moa_imputation_1pct.pkl"
    haldane_path: "results/moa_enrichment/bbbc036_moa_haldane_1pct.pkl"

normalization:
  run_by_default: false
  default_profile: "CSAll_Plate__PCA64__MADCtrl_Plate__NoSph"
  main_profile: "CSAll_Plate__PCA64__MADCtrl_Plate__NoSph"
  appendix_profiles:
    - "CSAll_Plate__PCA64__MADCtrl_Plate__SphCtrl_Batch"
    - "NoCS__PCA64__MADCtrl_Plate__NoSph"
    - "CSAll_Plate__NoPCA__MADCtrl_Plate__NoSph"
  smoke_profile: "CSAll_Plate__PCA8__MADCtrl_Plate__NoSph"

data:
  splits:
    - "bbbc036"
    - "cpg-moa"
    - "cpg-crispr"
    - "cpg-tgt2"
    - "cpg-compound"
  models:
    - "cellprofiler"
    - "cloome"
    - "dino_v2_cls_token"
    - "dino_v2_patch_token"
    - "open_phenom"
    - "resnet"
    - "resnet_untrained"
    - "subcell"

qc:
  enabled: true
  cell_count_cutoff: 0.05
  sample_wells: 5000
  seed: 42

benchmarks:
  n_resamples: 100
  run:
    moa: true
    crispr: true
    knn: true
    negative_control_map: true

exports:
  qc_heatmaps: true
  jaccard: true
  crispr_database_barplot: true
  haldane_diagnostic: true
  # The discrimination-score figure block is commented out in main.tex.
  discrimination_score: false
